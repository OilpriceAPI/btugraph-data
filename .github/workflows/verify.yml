name: Verify public snapshot

on:
  push:
  pull_request:
  # The sync job dispatches this on its branch: pushes made with the
  # workflow GITHUB_TOKEN do not trigger push/pull_request runs, so the
  # required 'Snapshot integrity' check never appeared on the bot PR.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Snapshot integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm run check
      - run: npm run example:javascript
      - run: npm run example:python
